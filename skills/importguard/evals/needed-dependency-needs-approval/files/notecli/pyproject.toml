    [build-system]
    requires = ["setuptools>=64"]
    build-backend = "setuptools.build_meta"

    [project]
    name = "notecli"
    version = "1.4.0"
    description = "A tiny note-taking CLI. Starts fast: it runs on every shell prompt."
    requires-python = ">=3.10"

    [project.scripts]
    notecli = "notecli.cli:main"

[tool.importguard]
entrypoints = ["notecli.cli"]
new_packages = "error"
