name: Publish to PyPI

on:
    push:
        tags: ["v*"]
    release:
        types: [published]
    # Manual run from main: publishes the version in pyproject.toml, then
    # creates its v<version> tag and GitHub release.
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            id-token: write # Required for trusted publishing
            contents: write # Create the tag and GitHub release

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Work out the release tag
              run: |
                  version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
                  if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                      if [ "$GITHUB_REF_NAME" != "main" ]; then
                          echo "::error::run this from main, not $GITHUB_REF_NAME"
                          exit 1
                      fi
                      tag="v$version"
                      if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
                          echo "::error::$tag already exists; bump the version first"
                          exit 1
                      fi
                  else
                      tag="$GITHUB_REF_NAME"
                      if [ "$version" != "${tag#v}" ]; then
                          echo "::error::tag $tag does not match version $version in pyproject.toml"
                          exit 1
                      fi
                  fi
                  echo "TAG=$tag" >> "$GITHUB_ENV"

            - name: Install build tools
              run: pip install build

            - name: Build package
              run: python -m build

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              # Uses trusted publishing - no API token needed
              # Configure at: https://pypi.org/manage/project/importguardpy/settings/publishing/

            # A tag or release created with GITHUB_TOKEN doesn't trigger
            # workflows, so this doesn't publish twice.
            - name: Create the GitHub release
              if: github.event_name != 'release'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  awk -v v="${TAG#v}" '
                      $0 ~ "^## \\[" v "\\]" {on=1; next}
                      on && /^## \[/ {exit}
                      on {print}
                  ' CHANGELOG.md > notes.md
                  gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
