name: Publish to PyPI

on:
    push:
        tags: ["v*"]
    release:
        types: [published]

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            id-token: write # Required for trusted publishing
            contents: write # Create the GitHub release on a tag push

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Check the tag matches the package version
              run: |
                  version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
                  tag="${GITHUB_REF_NAME#v}"
                  if [ "$version" != "$tag" ]; then
                      echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
                      exit 1
                  fi

            - name: Install build tools
              run: pip install build

            - name: Build package
              run: python -m build

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              # Uses trusted publishing - no API token needed
              # Configure at: https://pypi.org/manage/project/importguardpy/settings/publishing/

            # A release created with GITHUB_TOKEN doesn't trigger workflows, so
            # this doesn't publish twice.
            - name: Create the GitHub release
              if: github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  awk -v v="${GITHUB_REF_NAME#v}" '
                      $0 ~ "^## \\[" v "\\]" {on=1; next}
                      on && /^## \[/ {exit}
                      on {print}
                  ' CHANGELOG.md > notes.md
                  gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
