name: importguard
description: "Reports what a pull request adds to Python startup: new packages, the import that pulled them in, import-time side effects."
branding:
  icon: shield
  color: green

inputs:
  mode:
    description: "`diff` (default): report what the PR adds vs. its base commit, no setup needed. `check`: compare against importguard.lock."
    required: false
    default: diff
  base:
    description: "diff mode: base commit (default: the PR's base, or the previous commit on push)."
    required: false
    default: ""
  allow-label-prefix:
    description: "diff mode: a PR label `<prefix><package>` approves that new startup package; the label `importguard:approved` approves all."
    required: false
    default: "importguard:allow:"
  args:
    description: Extra arguments (e.g. entrypoints, --strict).
    required: false
    default: ""
  python:
    description: "Interpreter to probe with (default: `python` on PATH)."
    required: false
    default: python
  comment:
    description: "Keep one PR comment updated with the report (needs `pull-requests: write`; warns and carries on without it). On fork PRs the report is uploaded for the importguard-comment workflow instead."
    required: false
    default: "true"
  github-token:
    description: Token used to post the PR comment.
    required: false
    default: ${{ github.token }}
  comment-author:
    description: "Login that owns the importguard comment (the token's user). Only that user's comment is updated."
    required: false
    default: github-actions[bot]

outputs:
  exit-code:
    description: "0 ok, 1 violations, 2 usage/config error, 3 tool error."
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install importguard
      shell: bash
      run: '"${{ inputs.python }}" -m pip install --quiet "${{ github.action_path }}"'

    - name: Check imports
      id: check
      shell: bash
      env:
        IG_MODE: ${{ inputs.mode }}
        IG_ARGS: ${{ inputs.args }}
        IG_PYTHON: ${{ inputs.python }}
        IG_BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
        IG_PREFIX: ${{ inputs.allow-label-prefix }}
        IG_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        cmd=(check)
        if [ "$IG_MODE" = "diff" ]; then
          cmd=(diff)
          if [ -n "$IG_BASE" ] && ! [[ "$IG_BASE" =~ ^0+$ ]]; then
            # Make sure the base commit and enough history for a merge-base are present.
            git fetch --no-tags --quiet origin "$IG_BASE" 2>/dev/null || true
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --no-tags --quiet --unshallow origin 2>/dev/null || true
            fi
            cmd+=(--base "$IG_BASE")
          fi
          # Approvals come from PR labels, which the change itself cannot add.
          allow=()
          while IFS= read -r label; do
            case "$label" in
              importguard:approved) allow+=("*") ;;
              "$IG_PREFIX"?*) allow+=("${label#"$IG_PREFIX"}") ;;
            esac
          done < <("$IG_PYTHON" -c 'import json, os; print("\n".join(json.loads(os.environ.get("IG_LABELS") or "null") or []))')
          if [ "${#allow[@]}" -gt 0 ]; then
            IMPORTGUARD_ALLOW="$(IFS=,; echo "${allow[*]}")"
            export IMPORTGUARD_ALLOW
          fi
        fi
        set +e
        # shellcheck disable=SC2086
        "$IG_PYTHON" -m importguard "${cmd[@]}" --python "$IG_PYTHON" --format markdown $IG_ARGS > "$RUNNER_TEMP/importguard.md"
        code=$?
        set -e
        cat "$RUNNER_TEMP/importguard.md" >> "$GITHUB_STEP_SUMMARY"
        cat "$RUNNER_TEMP/importguard.md"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Comment on pull request
      # Same-repository PRs: the job's token can comment directly.
      if: >-
        inputs.comment == 'true' && github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        AUTHOR: ${{ inputs.comment-author }}
        BODY_FILE: ${{ runner.temp }}/importguard.md
      run: bash "${{ github.action_path }}/scripts/post-comment.sh"

    - name: Prepare report for the comment workflow
      # Fork PRs get a read-only token, so commenting here cannot work. Hand the
      # report to the importguard-comment workflow (workflow_run), which runs
      # trusted code with a write token and never executes the PR's code.
      if: >-
        inputs.comment == 'true' && github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository
      shell: bash
      env:
        PR: ${{ github.event.pull_request.number }}
        OUT: ${{ runner.temp }}/importguard-report
      run: |
        mkdir -p "$OUT"
        cp "$RUNNER_TEMP/importguard.md" "$OUT/report.md"
        echo "$PR" > "$OUT/pr.txt"
        echo "::notice::importguard: fork PR, so the report is uploaded for the importguard-comment workflow to post (see the README). It is also in this job's summary."

    - name: Upload report for the comment workflow
      if: >-
        inputs.comment == 'true' && github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository
      uses: actions/upload-artifact@v4
      with:
        name: importguard-report
        path: ${{ runner.temp }}/importguard-report
        retention-days: 7
        overwrite: true

    - name: Fail on violations
      shell: bash
      run: exit ${{ steps.check.outputs.exit-code }}
