name: importguard
description: >-
  Report what a pull request adds to your Python entrypoints' startup imports (new
  dependencies, forbidden modules, import-time side effects) with the exact line to
  change. No setup: the baseline is the PR's base commit.
branding:
  icon: shield
  color: green

inputs:
  mode:
    description: "`diff` (default): report what the PR adds vs. its base commit, no setup needed. `check`: compare against importguard.lock."
    required: false
    default: diff
  base:
    description: "diff mode: base commit (default: the PR's base, or the previous commit on push)."
    required: false
    default: ""
  allow-label-prefix:
    description: "diff mode: a PR label `<prefix><package>` approves that new startup package; the label `importguard:approved` approves all."
    required: false
    default: "importguard:allow:"
  args:
    description: Extra arguments (e.g. entrypoints, --strict).
    required: false
    default: ""
  python:
    description: "Interpreter to probe with (default: `python` on PATH)."
    required: false
    default: python
  comment:
    description: "Post (and keep updated) a PR comment with the report. Needs `pull-requests: write`."
    required: false
    default: "false"
  github-token:
    description: Token used to post the PR comment.
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: "0 ok, 1 violations, 2 usage/config error, 3 tool error."
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install importguard
      shell: bash
      run: '"${{ inputs.python }}" -m pip install --quiet "${{ github.action_path }}"'

    - name: Check imports
      id: check
      shell: bash
      env:
        IG_MODE: ${{ inputs.mode }}
        IG_ARGS: ${{ inputs.args }}
        IG_PYTHON: ${{ inputs.python }}
        IG_BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
        IG_PREFIX: ${{ inputs.allow-label-prefix }}
        IG_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        cmd=(check)
        if [ "$IG_MODE" = "diff" ]; then
          cmd=(diff)
          if [ -n "$IG_BASE" ] && ! [[ "$IG_BASE" =~ ^0+$ ]]; then
            # Make sure the base commit and enough history for a merge-base are present.
            git fetch --no-tags --quiet origin "$IG_BASE" 2>/dev/null || true
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --no-tags --quiet --unshallow origin 2>/dev/null || true
            fi
            cmd+=(--base "$IG_BASE")
          fi
          # Approvals come from PR labels, which the change itself cannot add.
          allow=()
          while IFS= read -r label; do
            case "$label" in
              importguard:approved) allow+=("*") ;;
              "$IG_PREFIX"?*) allow+=("${label#"$IG_PREFIX"}") ;;
            esac
          done < <("$IG_PYTHON" -c 'import json, os; print("\n".join(json.loads(os.environ.get("IG_LABELS") or "null") or []))')
          if [ "${#allow[@]}" -gt 0 ]; then
            IMPORTGUARD_ALLOW="$(IFS=,; echo "${allow[*]}")"
            export IMPORTGUARD_ALLOW
          fi
        fi
        set +e
        # shellcheck disable=SC2086
        "$IG_PYTHON" -m importguard "${cmd[@]}" --python "$IG_PYTHON" --format markdown $IG_ARGS > "$RUNNER_TEMP/importguard.md"
        code=$?
        set -e
        cat "$RUNNER_TEMP/importguard.md" >> "$GITHUB_STEP_SUMMARY"
        cat "$RUNNER_TEMP/importguard.md"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Comment on pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        body="$RUNNER_TEMP/importguard-comment.md"
        { echo "<!-- importguard -->"; cat "$RUNNER_TEMP/importguard.md"; } > "$body"
        id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq '[.[] | select(.body | startswith("<!-- importguard -->"))][0].id // empty')
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" > /dev/null
        else
          gh api "repos/$REPO/issues/$PR/comments" -F "body=@$body" > /dev/null
        fi

    - name: Fail on violations
      shell: bash
      run: exit ${{ steps.check.outputs.exit-code }}
