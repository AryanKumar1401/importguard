name: importguard comment
description: "Posts importguard's report on pull requests from forks, from a workflow_run workflow. Never runs the PR's code."
branding:
  icon: message-square
  color: green

inputs:
  github-token:
    description: "Token with `pull-requests: write` and `actions: read`."
    required: false
    default: ${{ github.token }}
  comment-author:
    description: Login that owns the importguard comment (the token's user).
    required: false
    default: github-actions[bot]

runs:
  using: composite
  steps:
    - name: Download the report
      if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
      id: download
      continue-on-error: true # no report: not a fork PR, or the check did not run
      uses: actions/download-artifact@v4
      with:
        name: importguard-report
        path: ${{ runner.temp }}/importguard-report
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ inputs.github-token }}

    - name: Post the report
      if: steps.download.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        AUTHOR: ${{ inputs.comment-author }}
        REPORT_DIR: ${{ runner.temp }}/importguard-report
        RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: bash "${{ github.action_path }}/../scripts/relay-comment.sh"
